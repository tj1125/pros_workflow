camera:
  camera_name: "Camera_Car"
  intrinsics_path: "../data/camera_parameter/Intrinsics/Camera_Car.yaml"

models:
  yolo_weights: "../../models/yolo/best.pt"
  sam_seg_checkpoint: "../../models/segmentation/sam_vit_b_01ec64.pth"
  graspgen_root: "../shared_vendor/graspgen_runtime"
  gripper_config: "../../models/graspgen_checkpoints/graspgen_robotiq_2f_140.yml"

runtime:
  device: "cuda"
  sam_model_type: "vit_b"
  depth_scale: 1000.0
  yolo_conf_threshold: 0.25
  min_depth_m: 0.14
  max_depth_m: 3.0
  object_point_stride: 1
  scene_point_stride: 4
  object_voxel_size_m: 0.002
  scene_voxel_size_m: 0.01
  grasp_threshold: -1.0
  num_grasps: 400
  topk_num_grasps: 200
  gripper_midpoint_camera_xyz: [0.0, -0.04, 0.11]
  max_grasp_local_z: 0.0
  max_grasp_pitch_deg: 30.0
  collision_threshold: 0.01
  max_collision_scene_points: 8192
  num_collision_samples: 2000
