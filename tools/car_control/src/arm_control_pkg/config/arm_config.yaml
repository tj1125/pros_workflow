global:
  joints_count: 5.0
  arm_topic: /robot_arm
  joint_state_topic: /joint_states
  joint_state_names:
    - base_link2_v2_1
    - link3_v1_1
    - link4_v1_1
    - robot_ver7_link_4_v1_1
    - [robot_ver7_grap1_2_v1_1, robot_ver7_grap2_2_v1_1]
  imu_receive_topic: /imu/data_raw
  yolo_object_offset_receive_topic: /yolo/object/offset
