pybullet:
  urdf_name: target.urdf
  gui: false
  view_world: false
  initial_height: 0.21
  base_orientation_euler_deg: [0.0, 0.0, 0.0]
  controllable_joints: 5
  end_eff_index: [4, 8]
  ik_max_num_iterations: 200
  ik_residual_threshold: 1e-5
  time_step: 1e-3
joints:
  0:
    min_angle: 0.0
    max_angle: 240.0
  1:
    min_angle: 0.0
    max_angle: 240.0
  2:
    min_angle: 0.0
    max_angle: 150.0
  3:
    min_angle: 0.0
    max_angle: 180.0
  4:
    min_angle: 10.0
    max_angle: 70.0
joints_reset:
  0: 90.0
  1: 30.0
  2: 150.0
  3: 90.0
  4: 10.0
