# Base Pose Sampling — Configuration
#
# Coordinate frame note
# ---------------------
# target_unity_xyz   : Unity world frame  [x, y, z]  where Y=up, floor=X-Z plane
# target_approach_dir_unity_xz : normalised [x, z] in Unity floor plane;
#     the direction the gripper travels when approaching the object.
#     Leave as null to skip the approach-direction filter (all headings allowed).
#
# The map is loaded from a ROS-style PGM + YAML pair.  Free cells are projected
# into Unity (x, z) using:  unity_x = map_x,  unity_z = map_y.

# ── Target (Unity world frame) ────────────────────────────────────────────────
# Grasp EE position in Unity world coordinates.  y = 0.51 is the EE height.
target_unity_xyz: [1.5, 0.51, 2.0]

# Optional: normalised approach direction in Unity floor plane [x, z].
# The robot base will be placed such that base→target is within
# ±heading_tolerance_deg of this direction.
# Set to null to disable this filter.
target_approach_dir_unity_xz: null

# ── Map (navigable region) ────────────────────────────────────────────────────
# Path relative to REPO_ROOT (VLM_RL/); _resolve_input_path checks REPO_ROOT as a search root.
map_yaml_path: tools/car_control/src/nav_goal_bridge_pkg/config/map01.yaml

# ── Planner ───────────────────────────────────────────────────────────────────
planner_config_path: configs/pybullet_ompl.yaml

# ── Input Data (Scene & Target) ───────────────────────────────────────────────
# Path to the NPZ file produced by the grasp agent pipeline (e.g. latest_grasp_debug.npz).
# If provided, target_unity_xyz and voxel obstacles will be automatically
# extracted from this file, ignoring manual target_unity_xyz.
grasp_debug_npz_path: /workspaces/VLM_RL/3090server/VLM_RL/grasp_agent/data/debug_outputs/latest_grasp_debug.npz

# Fallback target position (Unity world frame) if grasp_debug_npz_path is null.
# y = 0.51 is the target height.
target_unity_xyz: [1.5, 0.51, 2.0]

# When grasp_debug_npz_path is set, its contents are relative to the camera.
# We need to anchor the camera into the global Unity map.
# These fields specify the camera's assumed global Unity pose (AMCL-like)
# AT THE TIME the snapshot was captured.
robot_unity_x_at_snapshot: -2.857978432405398
robot_unity_y_at_snapshot: 0.0
robot_unity_z_at_snapshot: -0.518159792346899
robot_heading_rad_at_snapshot: -0.9106090623

# ── Obstacle appearance ───────────────────────────────────────────────────────
voxel_size_m: 0.05
obstacle_rgba: [0.85, 0.2, 0.2, 0.55]

# ── Sampling parameters ───────────────────────────────────────────────────────
# Unity Y of the robot's ground level (camera car floor height in Unity).
base_ground_y_unity: 0.0

# Horizontal distance range (metres) from candidate base to target.
min_distance_m: 0.05
max_distance_m: 0.25

# Circular base footprint radius. Sampling erodes map free cells by this
# radius so candidate base centers are not placed too close to occupied cells.
# (Used by run_base_pose_sampling.py pipeline only.)
base_footprint_radius_m: 0.0

# Only keep candidates whose base→target heading is within this angle of
# target_approach_dir_unity_xz.  Ignored when target_approach_dir_unity_xz
# is null.
heading_tolerance_deg: 30.0

# Maximum number of map free cells to sample before IK evaluation.
num_samples: 50

# ── test_base_sampler.py 專用 ─────────────────────────────────────────────────
# Offset from vehicle center (AMCL) to arm base_link in PyBullet local frame [x, y].
base_link_from_amcl_pb_xy: [0.0, 0.1288]

# Half-angle (degrees) for approach direction filter.
# Only sample points whose base→target direction is within ±this angle
# of the grasp approach axis.
approach_half_angle_deg: 30.0


# ── IK / OMPL evaluation ─────────────────────────────────────────────────────
# Acceptable IK end-effector position error (metres).
position_tolerance_m: 0.03

# Acceptable IK end-effector orientation error (degrees).
orientation_tolerance_deg: 12.0

# After IK ranking, only the top-N candidates are passed to OMPL.
max_ik_candidates: 20

# If true, run OMPL on ALL max_ik_candidates even after the first success.
# Useful for collecting a full feasibility dataset.  Set to false for speed.
evaluate_all: false

# ── Render ────────────────────────────────────────────────────────────────────
render_width: 960
render_height: 720
render_camera_distance: 1.2
render_yaw_deg: 45.0
render_pitch_deg: -30.0

# ── Output ────────────────────────────────────────────────────────────────────
output_root_dir: outputs/base_pose_sampling
