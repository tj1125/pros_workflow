experiment: sac_rpld
device: cpu

env:
  num_envs: 3
  obs_dim: 3
  n_actions: 7
  success_threshold: 0.05
  max_steps: 80

offline:
  data_path: data/offline_buffer.jsonl
  capacity: 100000
  batch_size: 256
  total_updates: 10000

online:
  buffer_capacity: 200000
  total_env_steps: 2000
  start_learning: 1000
  batch_size: 256
  utd_ratio: 1

hybrid:
  offline_path: data/offline_buffer.jsonl
  online_capacity: 200000
  batch_size: 256
  utd_ratio: 4
  total_env_steps: 2000
  start_learning: 1000

rl:
  gamma: 0.99
  alpha: 0.2
  critic_lr: 3e-7
  actor_lr: 1e-4
  n_critics: 2

paths:
  offline_ckpt: data/offline_ckpt.pt
  online_ckpt: data/online_ckpt.pt
  hybrid_ckpt: data/hybrid_ckpt.pt
  offline_log: data/offline_log.csv
  online_log: data/online_log.csv
  hybrid_log: data/hybrid_log.csv

joints_reset:
  0: 90.0
  1: 30.0
  2: 160.0
  3: 180.0
  4: 70.0