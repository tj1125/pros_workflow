camera_name: Camera_Car
capture_timeout_sec: 15.0
amcl_topic: /amcl_pose
intrinsics_path: ../../../3090server/VLM_RL/grasp_agent/data/camera_parameter/Intrinsics/Camera_Car.yaml
# Optional offline debug input. When set, the pipeline skips ROS capture and loads
# the point cloud directly from the NPZ key below.
# Example:
# debug_npz_path: ../../../3090server/VLM_RL/grasp_agent/data/debug_outputs/latest_grasp_debug.npz
debug_npz_path: null
debug_scene_pointcloud_key: scene_pc_camera
debug_target_grasp_key: best_grasp_camera
planner_config_path: configs/pybullet_ompl.yaml
output_root_dir: outputs/camera_car_voxel_ompl
# 9 cm^3 voxel volume => cube side length cbrt(9) cm = 0.0208008 m.
voxel_size_m: 0.0208008
min_depth_m: 0.19
# Only keep scene points within 1.0 m from the camera depth axis.
max_depth_m: 1.5
flip_depth_vertical: true
# Use every valid depth pixel so the voxel scene is as complete as possible.
pixel_stride: 1
# 0 disables the voxel-count cap so every occupied voxel is sent into PyBullet.
max_voxel_obstacles: 0
obstacle_rgba: [0.85, 0.2, 0.2, 0.55]
# Single source of truth for the gripper midpoint in camera coordinates.
gripper_midpoint_camera_xyz: [0.0, -0.0824, 0.023]
crop_to_workspace_camera: false
workspace_bounds_camera:
  min_xyz: [0.10, -0.60, 0.00]
  max_xyz: [0.65, 0.60, 0.65]
